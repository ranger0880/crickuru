services:
  - type: web
    name: crickuru-bot
    runtime: node
    rootDir: bot
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    envVars:
      - key: CORS_ORIGINS
        value: https://crickuru.com,https://www.crickuru.com
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: SOCIAL_STORE_FILE
        value: /tmp/crickuru-social.json
