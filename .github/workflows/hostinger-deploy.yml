name: Deploy CricKuru to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostinger-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and publish to public_html
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production site
        env:
          VITE_AUTH_API_URL: ${{ secrets.VITE_AUTH_API_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
        run: npm run build

      - name: Check Hostinger secrets
        env:
          FTP_SERVER: ${{ secrets.HOSTINGER_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
        run: |
          test -n "$FTP_SERVER" || (echo "Missing HOSTINGER_FTP_SERVER" && exit 1)
          test -n "$FTP_USERNAME" || (echo "Missing HOSTINGER_FTP_USERNAME" && exit 1)
          test -n "$FTP_PASSWORD" || (echo "Missing HOSTINGER_FTP_PASSWORD" && exit 1)

      - name: Normalize FTP server address
        id: ftp-server
        env:
          FTP_SERVER: ${{ secrets.HOSTINGER_FTP_SERVER }}
        run: |
          server="$FTP_SERVER"
          server="${server#ftp://}"
          server="${server#ftps://}"
          server="${server%/}"
          echo "server=$server" >> "$GITHUB_OUTPUT"

      - name: Sync built files to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ steps.ftp-server.outputs.server }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          port: 21
          protocol: ftp
          local-dir: ./dist/
          server-dir: public_html/
          state-name: .crickuru-hostinger-public-sync-state.json
          dangerous-clean-slate: false
          timeout: 120000
          log-level: minimal
