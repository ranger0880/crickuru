name: Deploy CricKuru to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostinger-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and publish to public_html
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production site
        env:
          VITE_AUTH_API_URL: ${{ secrets.VITE_AUTH_API_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_BOT_API_URL: ${{ secrets.VITE_BOT_API_URL }}
          VITE_AMAZON_ASSOCIATE_TAG: ${{ secrets.VITE_AMAZON_ASSOCIATE_TAG }}
        run: npm run build

      - name: Prepare compatibility aliases for cached Hostinger pages
        shell: bash
        run: |
          set -euo pipefail
          # The production build already creates legacy asset aliases. Keep
          # this step safe if an alias is present, and only add the data alias
          # when it is missing.
          test -f dist/assets/index-_XkMW-m6.js
          test -f dist/assets/index-8uKMYpLS.css
          if [ ! -f dist/data/crickuru-live-v3.json ]; then
            cp dist/data/crickuru-live.json dist/data/crickuru-live-v3.json
          fi

      - name: Check Hostinger secrets
        env:
          FTP_SERVER: 93.127.208.60
          FTP_USERNAME: u100370327
          FTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
        run: |
          test -n "$FTP_SERVER" || (echo "Missing HOSTINGER_FTP_SERVER" && exit 1)
          test -n "$FTP_USERNAME" || (echo "Missing HOSTINGER_FTP_USERNAME" && exit 1)
          test -n "$FTP_PASSWORD" || (echo "Missing HOSTINGER_FTP_PASSWORD" && exit 1)

      - name: Normalize FTP server address
        id: ftp-server
        env:
          FTP_SERVER: 93.127.208.60
        run: |
          server="$FTP_SERVER"
          server="${server#ftp://}"
          server="${server#ftps://}"
          server="${server%/}"
          echo "server=$server" >> "$GITHUB_OUTPUT"

      - name: Upload built files to Hostinger web root
        env:
          FTP_SERVER: ${{ steps.ftp-server.outputs.server }}
          FTP_USERNAME: u100370327
          FTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          # Hostinger accounts can expose more than one FTP root. Refresh the
          # known CricKuru web roots so the active domain root receives the build.
          # This also refreshes the root after a domain is connected in hPanel.
          roots=("" "public_html" "domains/crickuru.com" "domains/crickuru.com/public_html")
          for root in "${roots[@]}"; do
            echo "Refreshing FTP root: /${root}"
            while IFS= read -r -d '' file; do
              relative="${file#dist/}"
              echo "Uploading /${root}/${relative}"
              curl --fail --silent --show-error --ftp-pasv --ftp-create-dirs \
                --connect-timeout 30 --max-time 180 \
                --user "$FTP_USERNAME:$FTP_PASSWORD" \
                --upload-file "$file" "ftp://$FTP_SERVER/${root:+$root/}$relative"
            done < <(find dist -type f -print0)
          done
