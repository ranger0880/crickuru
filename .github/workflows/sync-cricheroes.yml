name: Kurukshetra Warriors CricHeroes Feed Sync

on:
  schedule:
    # Frequent public Pages refresh for live-score periods. GitHub schedules use UTC.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sync-build-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync Kurukshetra Warriors CricHeroes feed
        id: sync
        run: node tools/sync-cricheroes.mjs

      - name: Check for CricHeroes feed changes
        id: changes
        run: |
          if git diff --quiet -- data/crickuru-live.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No CricHeroes feed changes."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "CricHeroes feed changed."
          fi

      - name: Build production site
        if: steps.changes.outputs.changed == 'true'
        run: npm run build

      - name: Store refreshed feed in repo
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/crickuru-live.json crickuru-hostinger-upload.zip
          git commit -m "Sync CricHeroes live feed [skip ci]"
          git push

      - name: Setup Pages
        if: steps.changes.outputs.changed == 'true'
        uses: actions/configure-pages@v5

      - name: Upload production site
        if: steps.changes.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        if: steps.changes.outputs.changed == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
