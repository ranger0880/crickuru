name: Kurukshetra Warriors CricHeroes Feed Sync

on:
  schedule:
    # Frequent public Pages refresh for live-score periods. GitHub schedules use UTC.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cricheroes-feed-sync
  cancel-in-progress: true

jobs:
  sync-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync Kurukshetra Warriors CricHeroes feed
        id: sync
        run: node tools/sync-cricheroes.mjs

      - name: Check for CricHeroes feed changes
        id: changes
        run: |
          if git diff --quiet -- data/crickuru-live.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No CricHeroes feed changes."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "CricHeroes feed changed."
          fi

      - name: Store refreshed feed in repo
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/crickuru-live.json
          git commit -m "Sync CricHeroes live feed"
          git push
