name: India Cricket Match Feed Sync

on:
  schedule:
    # Near-live public score refresh. GitHub schedules use UTC.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Keep the two scheduled data writers from racing on main.
  group: crickuru-data-refresh
  cancel-in-progress: false

jobs:
  sync-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync India cricket match feed
        run: node tools/sync-india-matches.mjs

      - name: Store refreshed India feed in repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/india-matches.json
          if git diff --cached --quiet; then
            echo "No India match feed changes to commit."
          else
            git commit -m "Sync India cricket match feed"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
